<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Outline -->
  <path d="M50 8 L85 24 C85 58 50 88 50 88 C50 88 15 58 15 24 Z" 
        fill="#0b1329" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5"
        filter="url(#glow)" />

  <!-- Inner Circuit Network Nodes (Federated Learning Concept) -->
  <circle cx="50" cy="35" r="3" fill="#06b6d4" />
  <circle cx="34" cy="50" r="3" fill="#3b82f6" />
  <circle cx="66" cy="50" r="3" fill="#3b82f6" />
  <circle cx="40" cy="68" r="3" fill="#8b5cf6" />
  <circle cx="60" cy="68" r="3" fill="#8b5cf6" />

  <line x1="50" y1="35" x2="34" y2="50" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="50" y1="35" x2="66" y2="50" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="34" y1="50" x2="40" y2="68" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="66" y1="50" x2="60" y2="68" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
  <line x1="40" y1="68" x2="60" y2="68" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Medical Cross in Center -->
  <path d="M46 44 H54 V48 H58 V56 H54 V60 H46 V56 H42 V48 H46 Z" fill="url(#crossGrad)" filter="url(#glow)" />
</svg>
